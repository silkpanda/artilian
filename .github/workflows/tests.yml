# Runs the checks on GitHub's machines for every push and pull request, so each
# one gets a green check or a red cross. Uses Java 21 to match NeoForge 1.21.1.
name: Tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      CI: "true"

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # Public repo: fail if personal info slips in. Patterns live in a repo secret,
      # and only a count is printed, so a match never echoes into the public log.
      - name: Personal-info guard
        shell: bash
        env:
          BLOCKLIST: ${{ secrets.PERSONAL_INFO_BLOCKLIST }}
        run: |
          if [ -z "$BLOCKLIST" ]; then echo "No blocklist secret available; skipping."; exit 0; fi
          printf '%s\n' "$BLOCKLIST" > "$RUNNER_TEMP/bl"
          a=$(git ls-files | grep -ciEf "$RUNNER_TEMP/bl" || true)
          b=$(git grep -IhiEf "$RUNNER_TEMP/bl" | wc -l || true)
          n=$(( ${a:-0} + ${b:-0} ))
          rm -f "$RUNNER_TEMP/bl"
          if [ "$n" -gt 0 ]; then echo "Personal-info guard: $n match(es). Run the local check to see them."; exit 1; fi
          echo "Personal-info guard: clean."

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Validate docs baseline
        shell: bash
        run: |
          test -f PRODUCT.md
          test -f PLAN.md
          test -f AGENTS.md
          test -f CLAUDE.md
          test -f README.md

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate data
        run: ./gradlew runData --no-daemon

      - name: Check generated data is committed
        shell: bash
        run: |
          if [ -n "$(git status --porcelain src/generated)" ]; then
            echo "Datagen output differs from what is committed. Run ./gradlew runData and commit src/generated."
            git status --porcelain src/generated
            exit 1
          fi

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Run GameTests
        run: ./gradlew runGameTestServer --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: adventures-in-artilian-jar
          path: build/libs/adventures-in-artilian-*.jar
          if-no-files-found: error
